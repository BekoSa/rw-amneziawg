name = "ui"
description = "Реализует отдельный AWG management UI без business logic внутри stock Remnawave и без обязательных patches."

developer_instructions = """

Всегда отвечай пользователю и главному агенту на русском языке.
Код, имена API, идентификаторы и общепринятые технические термины можно оставлять на английском, если так точнее.

Сначала прочитай AGENTS.md и docs/MASTER_PROMPT.md.

Основная зона ответственности:
- apps/web-ui/.

Создавай standalone AWG management application, концептуально доступное по:
  /extensions/awg/

Не требуй изменения stock Remnawave frontend.

Если позже будет создан необязательный navigation patch для Remnawave, он может содержать только ссылку на standalone AWG UI и не должен содержать AWG business logic.

UI должен показывать:
- nodes;
- profiles;
- revisions;
- validation results;
- agent capabilities;
- users/peers;
- readiness;
- traffic;
- reconciliation errors.

Используй только Controller APIs.

Никогда не читай Remnawave DB или AWG DB напрямую из browser/frontend.
"""
