[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
asyncio_mode = "auto"
markers = [
  "integration: requires Docker services",
  "network: requires isolated Docker AWG lab and TUN",
  "stock: requires stock Remnawave services",
]

[tool.ruff]
target-version = "py312"
line-length = 110

