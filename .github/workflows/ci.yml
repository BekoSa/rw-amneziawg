# Every push to main and every pull request: lint, unit/contract/golden/DB/TUI tests, the real
# AmneziaWG tunnel E2E and the installer check against stock Remnawave — all inside Docker.
# Pushes to main then publish the extension and agent images to GHCR (amd64 + arm64).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build lab images
        run: scripts/lab.sh build
      - name: Compose network safety lint
        run: scripts/lab.sh lint
      - name: Shellcheck
        run: docker run --rm -v "$PWD:/w:ro" koalaman/shellcheck:stable -S warning /w/install.sh /w/install-node.sh /w/uninstall.sh /w/scripts/install-managed-node.sh /w/scripts/lab.sh /w/scripts/managed-node-lab.sh /w/scripts/managed-awg-lab.sh /w/scripts/trusttunnel-lab.sh /w/scripts/stock-http-smoke.sh /w/scripts/test-installer.sh /w/scripts/update-amnezia.sh
      - name: Unit, contract, golden, DB and TUI tests
        run: scripts/lab.sh test
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: artifacts/run-*
          if-no-files-found: ignore

  e2e:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build lab images
        run: scripts/lab.sh build
      - name: Real AmneziaWG 3.1 tunnel E2E (stock Remnawave, Controller, Agent, Gateway)
        run: scripts/lab.sh e2e
      - name: install.sh / install-node.sh / uninstall.sh against stock panel and subscription page
        run: scripts/lab.sh installer
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: artifacts/run-*
          if-no-files-found: ignore


  trusttunnel:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated tooling and TrustTunnel runtime
        run: |
          scripts/lab.sh build
          scripts/trusttunnel-lab.sh build
      - name: TrustTunnel network safety lint
        run: scripts/trusttunnel-lab.sh lint
      - name: Real ACME and TrustTunnel connectivity
        run: scripts/trusttunnel-lab.sh test
      - name: Stock HTTP after extension removal and restoration
        run: scripts/stock-http-smoke.sh
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-evidence
          path: |
            artifacts/trusttunnel-run-*
            artifacts/stock-http-run-*
          if-no-files-found: ignore

  managed-node:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated managed node lab
        run: |
          scripts/lab.sh build
          scripts/managed-node-lab.sh build
      - name: Ingress unit tests
        run: docker build --target test -f apps/node-ingress/Dockerfile .
      - name: Managed node network safety lint
        run: scripts/managed-node-lab.sh lint
      - name: Managed ports, ACME, connectivity and revocation
        run: scripts/managed-node-lab.sh test
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-node-evidence
          path: artifacts/managed-node-run-*
          if-no-files-found: ignore

  managed-awg:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build managed AWG isolated lab
        run: scripts/managed-awg-lab.sh build
      - name: Real AWG through managed UDP ingress and stock removal/restoration
        run: scripts/managed-awg-lab.sh e2e
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-awg-evidence
          path: artifacts/managed-awg-run-*
          if-no-files-found: ignore

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e, trusttunnel, managed-node, managed-awg]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: extension
            dockerfile: Dockerfile
          - name: agent
            dockerfile: apps/node-agent/Dockerfile
          - name: ingress
            dockerfile: apps/node-ingress/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
